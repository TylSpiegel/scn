{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block content %}
    <section class="section">
        <div class="container">
            <div class="columns is-centered">
                <div class="column is-8-desktop is-10-tablet is-12-mobile">

                    <div class="page-header">
                        <h1 class="title is-2">{{ page.title }}</h1>
                    </div>

                    <div class="main-card">
                        <div class="content-body">
                            {% if page.intro %}
                                <div class="content">{{ page.intro|richtext }}</div>
                            {% endif %}

                            <form action="{% pageurl page %}" method="post" class="scn-form">
                                {% csrf_token %}
                                {% include "interaction/_form_fields.html" %}
                                <div class="field">
                                    <div class="control">
                                        <button type="submit" class="button is-primary">Envoyer</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </section>
{% endblock %}
