{% load wagtailcore_tags %}

{% if piece %}
    <div class="piece-ref is-flex is-align-items-center py-2">
        <span class="icon mr-3" style="color: var(--primary-color); font-size: 1.1rem;">
            <i class="fas fa-music"></i>
        </span>
        <div>
            <a href="{% pageurl piece %}" class="has-text-weight-semibold">{{ piece.title }}</a>
            <span style="color: var(--text-muted-color);"> — {{ piece.compositeur }}</span>
        </div>
    </div>
{% endif %}
